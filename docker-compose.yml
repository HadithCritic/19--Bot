services:
  bot:
    build:
      context: .
      args:
        # Keep in step with .python-version.
        PYTHON_VERSION: "3.13"
    image: 19bot:latest
    container_name: 19bot
    restart: unless-stopped

    env_file:
      - .env

    # init gives the container a real PID 1 that forwards SIGTERM, so `docker
    # stop` reaches the bot's shutdown path and the database closes cleanly
    # instead of the process being killed outright.
    init: true

    # The image runs as uid 10001. Bind mounts keep host ownership, so on native
    # Linux the mounted directories must be writable by that uid. Either chown
    # them once, or run as yourself:
    #   DOCKER_USER="$(id -u):$(id -g)" docker compose up -d
    # Docker Desktop on Windows and macOS maps ownership permissively and needs
    # neither.
    user: "${DOCKER_USER:-10001:10001}"

    environment:
      # The bot formats times in EST via zoneinfo regardless, but matching the
      # container clock keeps log timestamps readable.
      TZ: ${TZ:-America/New_York}

    volumes:
      # All three are state the bot writes. archives/ was previously missing,
      # so every channel export was lost when the container was recreated.
      - ./databases:/app/databases
      - ./logs:/app/logs
      - ./archives:/app/archives

    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
