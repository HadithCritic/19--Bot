name: Publish legal site

# Serves the Terms of Service and Privacy Policy as public pages, which Discord
# app verification requires. Discord's validator rejects any URL it cannot
# fetch, so these must be reachable without authentication.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/TERMS_OF_SERVICE.md"
      - "docs/PRIVACY_POLICY.md"
      - "scripts/build_legal_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      # Rebuild rather than trusting the committed output.
      - name: Build the site from the markdown
        run: python scripts/build_legal_site.py

      # configure-pages cannot enable Pages itself here. Its `enablement: true`
      # option calls the Create Pages Site API, which the default GITHUB_TOKEN
      # is not permitted to use ("Resource not accessible by integration"), so
      # Pages has to be switched on once by hand. This step turns that cryptic
      # API error into instructions.
      - name: Check that Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "Pages is enabled."
          else
            echo "::error title=GitHub Pages is not enabled::Enable it once, then re-run this workflow."
            echo ""
            echo "  Settings -> Pages -> Build and deployment -> Source: GitHub Actions"
            echo "  https://github.com/${{ github.repository }}/settings/pages"
            echo ""
            echo "This is a one-time manual step. The default GITHUB_TOKEN cannot"
            echo "create a Pages site, so no workflow change can replace it."
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          # site/.nojekyll is a dotfile, and this action excludes hidden files
          # by default from v4 onwards.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # The entire point is that Discord can fetch these, so prove it.
      - name: Verify both policy pages are publicly reachable
        run: |
          base="${{ steps.deployment.outputs.page_url }}"
          fail=0
          for page in terms.html privacy.html; do
            url="${base%/}/$page"
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 \
                        --retry-all-errors "$url")
            if [ "$code" = "200" ]; then
              echo "OK   $code  $url"
            else
              echo "::error::$url returned HTTP $code; Discord will reject this URL"
              fail=1
            fi
          done
          exit $fail
