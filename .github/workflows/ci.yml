name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Legal site is in step with the markdown
        run: python scripts/build_legal_site.py --check

      - name: Tests
        run: pytest --cov=core --cov=cogs --cov-report=term-missing

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      # Full history: the scan checks past commits, not just the current tree.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      # The same script used before publishing, rather than a separate ad-hoc
      # grep that could drift from it. Covers tracked paths, file contents, and
      # history. This repository is public, so a regression here is immediate
      # exposure of member data.
      - name: Pre-publication scan
        run: python scripts/preflight_public.py
